name: Sync game → docs (GitHub Pages)

on:
  push:
    branches: ["claude/forest-survival-game-3vyC7", "master"]
    paths: ["game/index.html"]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy game/index.html → docs/index.html
        run: cp game/index.html docs/index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes." || (git commit -m "chore: auto-sync docs from game/index.html [skip ci]" && git push)
